# Settings for the Y Lab's automated repo review (the `repo-review` skill in
# yy-lab/ylab-ai-skills: plugins/ylab/skills/repo-review).
#
# Every key below is commented out, so the lab defaults shown apply.
# To change one, uncomment and edit its line, then commit to the default
# branch; the scheduler reads the file from there. Check the file with
#   uv run <ylab-ai-skills>/plugins/ylab/skills/repo-review/scripts/review_settings.py check

# false turns scheduled reviews off for this repo.
# enabled = true

# How reviews deliver findings:
#   learning: explain findings and leave most fixes to the lead author; one item per review
#   balanced: explanatory issues plus small fix-it PRs
#   doing:    fix what fits a small PR; issues only for judgment calls
# focus = "balanced"

# Review the repo at most once per this many days (7 = weekly, 0.5 = up to twice a day).
# every_days = 1

# Pause reviews while this many review issues/PRs are open; closing one resumes them.
# Open items also space reviews out: with k open, the next one waits at least 2^k days.
# max_open = 4

# true turns on the full mock-review panel: 5–7 reviewer agents and a meta-review
# that updates mock-review/TRACKER.md. Costly; runs only from the drafting stage on.
# mock_review = false

# With mock_review on, run another panel once this share of the manuscript's lines
# has changed since the last one. At most one panel a day.
# mock_min_churn = 0.02

# Files each review aspect covers. This template's layout already matches the
# defaults, so add [paths] only if you move code elsewhere, e.g.
# [paths]
# pipeline = ["analysis/*", "Snakefile"]
